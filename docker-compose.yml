# Local n8n with this package mounted as a custom node.
#   npm install && npm run build
#   docker compose up -d      -> http://localhost:5678
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Europe/Berlin
      - TZ=Europe/Berlin
      - N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE=true
    volumes:
      - n8n_data:/home/node/.n8n
      - ./dist:/home/node/.n8n/custom/n8n-nodes-onenote-system:ro
      - ./package.json:/home/node/.n8n/custom/n8n-nodes-onenote-system/package.json:ro

volumes:
  n8n_data:
